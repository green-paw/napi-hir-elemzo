name: AI News Analysis with HTML Archive

on:
  schedule:
    - cron: '49 5,17 * * *'
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests pyTelegramBotAPI pytz scikit-learn markdown

      - name: Run AI News Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Kiszámoljuk a fájlnevet a branch alapján
          OUTPUT_FILENAME: >-
            ${{ github.ref_name == 'main' && 'index.html' || format('{0}_index.html', github.ref_name) }}
        run: python -u main.py

      - name: Prepare public directory
        run: |
          mkdir public
          cp *.html public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public # Csak a tiszta mappát publikáljuk
          keep_files: true
