name: AI News Analysis with HTML Archive

on:
  schedule:
    - cron: '49 3,16 * * *'
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}          

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache spaCy model file
        id: cache-spacy-model
        uses: actions/cache@v4
        with:
          # A letöltött wheel fájlt vagy a telepített csomagot is cache-elhetjük
          # De a legegyszerűbb a pip letöltési mappáját figyelni
          path: ~/.cache/pip
          key: ${{ runner.os }}-spacy-hu-md-v380 # Fix kulcs a modell verziójához

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Hungarian Spacy Model
        run: |
          pip install hu_core_news_md@https://huggingface.co/huspacy/hu_core_news_md/resolve/main/hu_core_news_md-any-py3-none-any.whl

      - name: Create checkpoints directory
        run: mkdir -p checkpoints

      - name: Restore/Save Checkpoints Cache
        uses: actions/cache@v4
        with:
          path: checkpoints/
          key: ${{ runner.os }}-news-checkpoints-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-news-checkpoints-

      - name: Set safe output filename
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/\\*?:"<>|' '_')
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "OUTPUT_FILENAME=index.html" >> $GITHUB_ENV
          else
            echo "OUTPUT_FILENAME=${SAFE_BRANCH}.html" >> $GITHUB_ENV
          fi

      - name: Run AI News Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CACHE_SETTINGS: ${{ vars.CACHE_SETTINGS }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python -u main.py

      - name: Save Checkpoints Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: checkpoints/
          key: ${{ runner.os }}-news-checkpoints-${{ github.run_id }}

      - name: Prepare public directory
        run: |
          mkdir -p public
          # Ellenőrizzük, van-e bármilyen HTML fájl a gyökérkönyvtárban
          if ls *.html 1> /dev/null 2>&1; then
            if [ -f index.html ]; then
              cp index.html public/${{ env.OUTPUT_FILENAME }}
            else
              cp *.html public/
            fi
            # Jelezzük a következő lépésnek, hogy van mit publikálni
            echo "has_html=true" >> $GITHUB_ENV
          else
            echo "Nincs HTML fájl, a felkészítés és a publikálás kimarad."
            echo "has_html=false" >> $GITHUB_ENV
          fi

      - name: Deploy to GitHub Pages
        if: env.has_html == 'true'  # <--- Csak akkor fut le, ha az előző lépés talált HTML-t
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public 
          keep_files: true
