name: AI News Analysis with HTML Archive

on:
  schedule:
    - cron: '49 4,16 * * *'
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests pyTelegramBotAPI pytz scikit-learn markdown

      - name: Create checkpoints directory
        run: mkdir -p checkpoints

      - name: Create checkpoints directory
        run: mkdir -p checkpoints

      - name: Restore/Save Checkpoints Cache
        uses: actions/cache@v4
        with:
          path: checkpoints/
          # A github.run_id minden futásnál egyedi, így mindig ment egy friss verziót a végén
          key: ${{ runner.os }}-news-checkpoints-${{ github.run_id }}
          # Ha nem találja a pontos kulcsot (márpedig nem fogja, mert a run_id új), 
          # akkor visszatölti a legutóbbit, ami ezzel a prefixszel kezdődik:
          restore-keys: |
            ${{ runner.os }}-news-checkpoints-

      - name: Set safe output filename
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/\\*?:"<>|' '_')
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "OUTPUT_FILENAME=index.html" >> $GITHUB_ENV
          else
            echo "OUTPUT_FILENAME=${SAFE_BRANCH}.html" >> $GITHUB_ENV
          fi

      - name: Run AI News Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u main.py

      - name: Prepare public directory
        run: |
          mkdir -p public
          if [ -f index.html ]; then
            cp index.html public/${{ env.OUTPUT_FILENAME }}
          else
            cp *.html public/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public 
          keep_files: true